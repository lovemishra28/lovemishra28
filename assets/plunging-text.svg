<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640">
  <style>
    .robot-font {
      font-family: 'Consolas', 'Courier New', 'SF Mono', 'Roboto Mono', 'Ubuntu Mono', monospace;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 9px;
    }

    .t-white {
      fill: #FFFFFF;
      font-size: 78px;
    }

    .t-light {
      fill: #FDF2F3;
      font-size: 78px;
    }

    .t-rose {
      fill: #F7A8B2;
      font-size: 78px;
    }

    .t-wine-bright {
      fill: #EA3B52;
      font-size: 78px;
    }

    .t-wine-base {
      fill: #931829;
      font-size: 78px;
    }

    .cursor {
      fill: #F06277;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Giant, Bold, Wide Robotic Stacked Typography (Width 600, Height 640) -->
  <text x="50%" y="125" text-anchor="middle" class="robot-font t-white">PLUNGING</text>
  <text x="50%" y="245" text-anchor="middle" class="robot-font t-light">ENDLESSLY</text>
  <text x="50%" y="365" text-anchor="middle" class="robot-font t-rose">INTO THE</text>
  <text x="50%" y="485" text-anchor="middle" class="robot-font t-wine-bright">DEEPNESS</text>
  <text x="50%" y="605" text-anchor="middle" class="robot-font t-wine-base">OF TECH<tspan class="cursor">_</tspan></text>
</svg>
