<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1321" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0)" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Share+Tech+Mono&amp;display=swap');

    .banner-title {
      font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 900;
      font-size: 68px;
      letter-spacing: 14px;
      text-transform: uppercase;
      fill: url(#titleGrad);
      filter: drop-shadow(0 4px 20px rgba(56, 189, 248, 0.4));
    }
    .banner-sub {
      font-family: 'Share Tech Mono', 'Courier New', 'Fira Code', monospace;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 7px;
      text-transform: uppercase;
      fill: #94A3B8;
    }
    .banner-tag {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 5px;
      fill: #38BDF8;
    }
    .star {
      fill: #FFFFFF;
      opacity: 0.6;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />

  <!-- Pixel Star Field -->
  <rect x="120" y="45" width="2" height="2" class="star" opacity="0.8" />
  <rect x="260" y="80" width="3" height="3" class="star" opacity="0.5" />
  <rect x="420" y="35" width="2" height="2" class="star" opacity="0.9" />
  <rect x="880" y="55" width="3" height="3" class="star" opacity="0.6" />
  <rect x="1040" y="90" width="2" height="2" class="star" opacity="0.7" />
  <rect x="150" y="190" width="2" height="2" class="star" opacity="0.4" />
  <rect x="310" y="215" width="3" height="3" class="star" opacity="0.8" />
  <rect x="750" y="200" width="2" height="2" class="star" opacity="0.5" />
  <rect x="980" y="180" width="3" height="3" class="star" opacity="0.7" />
  <rect x="1110" y="220" width="2" height="2" class="star" opacity="0.9" />

  <!-- Decorative Corner Accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 1175 50 L 1175 25 L 1150 25" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 25 210 L 25 235 L 50 235" fill="none" stroke="#818CF8" stroke-width="2.5" />
  <path d="M 1175 210 L 1175 235 L 1150 235" fill="none" stroke="#818CF8" stroke-width="2.5" />

  <!-- Center Content -->
  <text x="600" y="68" text-anchor="middle" class="banner-tag">&lt; DEVELOPER_SYSTEM_ONLINE /&gt;</text>
  <text x="600" y="146" text-anchor="middle" class="banner-title">LOVE MISHRA</text>
  
  <!-- Sleek Accent Line -->
  <line x1="280" y1="170" x2="920" y2="170" stroke="url(#lineGrad)" stroke-width="2" />

  <text x="600" y="205" text-anchor="middle" class="banner-sub">FULL-STACK • IOT &amp; SYSTEMS • AI SOLUTIONS</text>
</svg>
